# Patched simple-testsuite matrix.  Values are whitespace-separated.
# Command-line options (for example --linear-solvers) override [defaults].
# Use --patch-config FILE to select another file for both defaults and rules.
#
# A [rule NAME] applies when every when.FIELD matches and no unless.FIELD
# matches.  It can constrain fields with allow.FIELD, reject fields with
# deny.FIELD, reject outright with reject = yes, or require any one of the
# alternatives in each allow_any.GROUP.FIELD group.  `prefix:TEXT` matches
# values beginning with TEXT.  Valid fields are the names below.

[matrix]
# This order preserves the historical configuration-key and task order.
fields = linear handler scale when autodiff nonlinear method output abort skip assembly

[options]
# Long command-line option corresponding to each matrix field.
linear = --linear-solvers
handler = --matrix-handlers
scale = --scale-methods
when = --scale-when
autodiff = --autodiff
nonlinear = --nonlinear-solvers
method = --method
output = --output-format
abort = --abort-after
skip = --skip-initial-joint-assembly
assembly = --initial-assembly-of-deformable-and-force-elements

[arguments]
# argparse destination names used by the corresponding command-line options.
linear = linear_solvers
handler = matrix_handlers
scale = scale_methods
when = scale_when
autodiff = autodiff
nonlinear = nonlinear_solvers
method = method
output = output_format
abort = abort_after
skip = skip_initial_joint_assembly
assembly = initial_assembly_of_deformable_and_force_elements

[defaults]
linear = naive umfpack klu pardiso pardiso_64 y12 qr lapack siconossparse siconosdense
handler = map cc dir grad
scale = rowmaxcolumnmax iterative lapack rowmax columnmax rowsum columnsum
when = never always once
autodiff = autodiff noautodiff
nonlinear = newtonraphson linesearch linesearch-modified nox nox-newton-krylov nox-direct nox-broyden2 nox-broyden3 nox-broyden1 mcpnewtonminfb mcpnewtonfb bfgs siconosmcpnewtonminfb siconosmcpnewtonfb
method = impliciteuler cranknicolson ms2,0.6 ms3,0.6 ms4,0.6 ss2,0.6 ss3,0.6 ss4,0.6 hope,0.6 Bathe,0.6 msstc3,0.6 msstc4,0.6 msstc5,0.6 mssth3,0.6 mssth4,0.6 mssth5,0.6 DIRK33 DIRK43 DIRK54 hybrid,ms,0.6
output = netcdf-text
abort = input assembly derivatives regularstep,2
skip = not-skip skip
assembly = exclude include

[rule map-only linear solvers]
when.linear = naive lapack qr siconosdense siconossparse
allow.handler = map

[rule y12 handlers]
when.linear = y12
allow.handler = map cc dir

[rule pardiso and spqr handlers]
when.linear = pardiso pardiso_64 spqr
allow.handler = map grad

[rule never scaling method]
when.when = never
allow.scale = rowmaxcolumnmax

[rule linear solvers requiring never scaling]
when.linear = belos amesos siconosdense siconossparse pardiso pardiso_64 qr spqr y12
allow.when = never

[rule gradient handler needs autodiff]
when.handler = grad
allow.autodiff = autodiff

[rule mcpnewtonminfb needs autodiff]
when.nonlinear = mcpnewtonminfb
allow.autodiff = autodiff

[rule mcpnewtonfb unsupported linear solvers]
when.nonlinear = mcpnewtonfb
deny.linear = siconosdense siconossparse

[rule siconos mcp needs siconosdense]
when.nonlinear = prefix:siconosmcp
allow.linear = siconosdense

[rule nox unsupported linear solvers]
when.nonlinear = nox nox-direct prefix:nox-broyden
deny.linear = naive qr lapack siconosdense

[rule bfgs linear solvers]
when.nonlinear = bfgs
allow.linear = spqr qr

[rule included initial assembly cannot skip joints]
when.assembly = include
deny.skip = skip

[rule skipped joints require derivative abort]
when.skip = skip
unless.abort = derivatives
reject = yes

[rule skipped joints derivative baseline]
when.abort = derivatives
when.skip = skip
allow.linear = umfpack
allow.handler = map
allow.scale = rowmaxcolumnmax
allow.when = never
allow.nonlinear = newtonraphson
allow.method = impliciteuler

[rule included initial assembly requires assembly abort]
when.assembly = include
unless.abort = assembly
reject = yes

[rule input abort baseline]
when.abort = input
allow.linear = umfpack
allow.handler = map
allow.scale = rowmaxcolumnmax
allow.when = never
allow.nonlinear = newtonraphson
allow.method = impliciteuler

[rule assembly abort]
when.abort = assembly
allow.nonlinear = newtonraphson
allow.method = impliciteuler

[rule derivatives abort]
when.abort = derivatives
allow.method = impliciteuler

[rule regular step abort]
when.abort = prefix:regularstep,
allow_any.nonlinear-or-ms2.nonlinear = newtonraphson
allow_any.nonlinear-or-ms2.method = prefix:ms2
allow_any.linear-or-ms2.linear = umfpack
allow_any.linear-or-ms2.method = prefix:ms2
allow_any.handler-or-ms2.handler = map
allow_any.handler-or-ms2.method = prefix:ms2
allow_any.scale-or-ms2.scale = rowmaxcolumnmax
allow_any.scale-or-ms2.method = prefix:ms2
allow_any.when-or-ms2.when = never
allow_any.when-or-ms2.method = prefix:ms2
